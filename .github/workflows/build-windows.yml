name: Build Windows Desktop App (Setup.exe + Portable)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build

      - name: Build Windows Executables (Setup.exe & Portable.exe)
        run: npx electron-builder --win nsis portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Installers Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DJ-Workstation-Windows-Executables
          path: |
            dist-electron/*.exe
          retention-days: 30
